# The whole stack: both stores plus the search UI.
#
#   docker compose up --build
#
# then load a bundle into the running stores (once):
#
#   docker compose run --rm loader
#
# The UI is on http://localhost:8000. It has no authentication, so the ports
# below are published on localhost only; moving them to 0.0.0.0 publishes an
# open search API.

services:
  neo4j:
    image: neo4j:5-community
    environment:
      # Compose substitutes from a .env file in this directory. Quoted so a
      # password containing '/' cannot split the auth pair.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      # Repeated as a plain variable so the healthcheck below can authenticate;
      # NEO4J_AUTH is consumed by the entrypoint and not left in the shell.
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"  # browser UI
      - "127.0.0.1:7687:7687"  # bolt
    volumes:
      - neo4j-data:/data
    healthcheck:
      # cypher-shell exits non-zero until the database can actually answer a
      # query, which is later than the port opening.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image is distroless-ish: no curl, but it does ship a shell and
      # the service answers /readyz once the storage is open.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  webui:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: parses ./bundles and writes to both stores, then exits. Kept out
  # of the default `up` (profiles) because ingest is something you run when the
  # bundle changes, not every time the stack starts.
  loader:
    build: .
    profiles: ["load"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      QDRANT_URL: http://qdrant:6333
      BUNDLE: ${BUNDLE:-/bundles/ga4}
    volumes:
      # Mount the bundle read-only: the loaders only ever read it.
      - ./knowledge-catalog/okf/bundles:/bundles:ro
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        python neo4j_loader.py "$$BUNDLE" --prune
        python qdrant_loader.py "$$BUNDLE" --prune

volumes:
  neo4j-data:
  qdrant-data:
