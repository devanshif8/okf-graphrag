name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Pure logic only: no Neo4j, no Qdrant, no model download. The
      # integration suite skips itself when the stores are unreachable, which
      # is exactly what happens here, so this job needs no services.
      - name: Run tests
        run: pytest -q

  integration:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      QDRANT_URL: http://localhost:6333
      # Turn "stores unreachable" from a skip into a failure. Without this the
      # job would pass green whenever its own services failed to start, which
      # is the one outcome it exists to catch.
      OKF_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt

      # The embedding model is a real download; cache it so reruns don't refetch.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Run integration tests
        run: pytest tests/integration -q --ignore=tests/integration/test_eval_regression.py

      # Its own step so the log distinguishes "retrieval got worse" from "the
      # plumbing broke". They fail for entirely different reasons and are fixed
      # by entirely different people, and a quality regression buried in a
      # hundred passing plumbing tests is one nobody reads.
      - name: Retrieval quality gate
        run: pytest tests/integration/test_eval_regression.py -q
